catalogMode: prefer

ignoreWorkspaceRootCheck: true

shellEmulator: true

trustPolicy: no-downgrade

trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0
  - langium@3.3.1
packages:
  - playground
  - docs
  - packages/*
  - examples/*
catalogs:
  dev:
    '@antfu/eslint-config': ^9.0.0
    '@antfu/ni': ^30.1.0
    baseline-browser-mapping: ^2.10.37
    bumpp: ^11.1.0
    eslint: ^10.5.0
    lint-staged: ^17.0.7
    publint: ^0.3.21
    simple-git: ^3.36.0
    simple-git-hooks: ^2.13.1
    tsdown: ^0.17.3
    tsx: ^4.22.4
    typescript: ^6.0.3
    vite: ^8.0.16
  examples:
    '@slidev/cli': ^52.16.0
  inlined:
    '@antfu/utils': ^9.3.0
  prod:
    '@clack/prompts': ^1.5.1
    cac: ^7.0.0
    gray-matter: ^4.0.3
    picocolors: ^1.1.1
    tinyglobby: ^0.2.17
    unconfig: ^7.5.0
    xdg-basedir: ^5.1.0
    yaml: ^2.9.0
  testing:
    tinyexec: ^1.2.4
    vitest: ^4.1.9
    vitest-package-exports: ^1.2.0
  types:
    '@types/node': ^25.9.3
onlyBuiltDependencies:
  - esbuild
  - simple-git-hooks
allowBuilds:
  esbuild: true
  simple-git-hooks: true
