ignoreWorkspaceRootCheck: true
catalogMode: prefer

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - baseline-browser-mapping@2.11.26
  - vite@8.3.1

trustPolicy: no-downgrade
trustPolicyExclude:
  - semver@6.3.1
  - undici-types@6.21.0
  - langium@3.3.1

update:
  ignoreDeps:
    - typescript@7

shellEmulator: true

packages:
  - playground
  - docs
  - packages/*
  - examples/*

allowBuilds:
  esbuild: true
  simple-git-hooks: true

catalogs:
  dev:
    '@antfu/eslint-config': ^9.5.1
    '@antfu/ni': ^30.6.0
    baseline-browser-mapping: ^2.11.26
    bumpp: ^12.3.0
    eslint: ^10.11.0
    lint-staged: ^17.5.1
    publint: ^0.3.24
    simple-git: ^3.36.0
    simple-git-hooks: ^2.14.0
    tsdown: ^0.17.3
    tsx: ^4.23.15
    typescript: ^6.0.3
    vite: ^8.3.1
  examples:
    '@slidev/cli': ^53.0.0
  inlined:
    '@antfu/utils': ^9.3.0
  prod:
    '@clack/prompts': ^1.8.1
    cac: ^7.0.0
    picocolors: ^1.1.1
    tinyglobby: ^0.2.17
    unconfig: ^7.5.0
    xdg-basedir: ^5.1.0
    yaml: ^2.9.1
  testing:
    tinyexec: ^1.3.1
    vitest: ^5.0.1
    vitest-package-exports: ^1.2.0
  types:
    '@types/node': ^26.6.2
